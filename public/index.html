<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>排假系統</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:#f4f5f7;color:#222;padding-bottom:96px}
header{background:#06C755;color:#fff;padding:14px 16px;position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:18px}
.brand{display:flex;align-items:center;gap:10px}
.mascot{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#fff;flex:none}
.gear{color:#fff;font-size:20px;text-decoration:none;padding:4px}
.msw{display:flex;align-items:center;justify-content:center;gap:18px;margin:12px 0}
.msw button{border:1px solid #ddd;background:#fff;border-radius:8px;padding:6px 14px;font-size:16px;cursor:pointer}
.msw b{font-size:18px}
section{background:#fff;margin:10px 12px;border-radius:12px;padding:14px}
h2{font-size:15px;margin-bottom:10px}
.names{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.names button{padding:12px 0;border:1.5px solid #ddd;border-radius:10px;background:#fff;font-size:15px;font-weight:700;cursor:pointer}
.names button.on{background:#06C755;color:#fff;border-color:#06C755}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{font-size:12px;color:#888;text-align:center;padding:4px 0}
.dow.sun{color:#e5484d}.dow.sat{color:#2f6fed}
.day{border:1px solid #e3e3e3;border-radius:8px;background:#fff;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:54px;cursor:pointer}
.day .c{font-size:10px;color:#888}
.day .n{font-weight:700}
.day.we .n{color:#2f6fed}
.day.sun .n{color:#e5484d}
.day.me{background:#06C755;border-color:#06C755}
.day.me .n,.day.me .c{color:#fff}
.day.full{background:#f0f0f0;border-color:#ddd;cursor:not-allowed}
.day.full .n{color:#aaa}
.day.full .c{color:#e5484d;font-weight:700}
.day.closed{opacity:.25;background:#f5f5f5;cursor:not-allowed}
.day.closed .n{color:#bbb}
.day.closed .c{color:#bbb}
.day.blank{background:transparent;border:none;cursor:default}
.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.bar button{width:100%;padding:14px;border:none;border-radius:12px;background:#06C755;color:#fff;font-size:17px;font-weight:700;cursor:pointer}
.bar button:disabled{background:#ccc}
.bar button.ghost{background:#fff;color:#06C755;border:1.5px solid #06C755;margin-top:8px}
.hint{font-size:12px;color:#888;margin-top:8px;line-height:1.7}
.ok{text-align:center;padding:30px 10px}
.ok .big{font-size:52px}
.ok p{margin:10px 0;font-size:15px}
.tag{display:inline-block;background:#e8f9ee;color:#0a7d2c;border-radius:6px;padding:3px 10px;font-size:13px;margin:3px;font-weight:700}
#namespop-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40}
#namespop{display:none;position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:16px 16px 0 0;padding:18px 18px 26px;box-shadow:0 -4px 24px rgba(0,0,0,.18);z-index:50}
#namespop h3{margin:0 0 10px;font-size:16px}
#namespop .close{margin-top:14px;width:100%;padding:12px;border-radius:10px;border:1.5px solid #06C755;background:#fff;color:#06C755;font-size:16px;font-weight:700;cursor:pointer}
.err{color:#e5484d;font-size:13px;margin-top:8px;font-weight:700}
.bigbtn{width:100%;padding:14px;border:none;border-radius:12px;background:#06C755;color:#fff;font-size:17px;font-weight:700;cursor:pointer;margin-top:16px}
.bigbtn:disabled{background:#ccc}
.ghostbtn{width:100%;padding:12px;border-radius:12px;background:#fff;color:#666;border:1.5px solid #ddd;font-size:15px;cursor:pointer;margin-top:10px}
.pinlabel{display:block;font-size:14px;font-weight:700;margin:14px 0 6px}
input[type=password].pin{width:100%;border:1.5px solid #ddd;border-radius:10px;padding:12px;font-size:22px;letter-spacing:10px;text-align:center;font-family:inherit}
</style>
</head>
<body>
<header><div class="brand"><video class="mascot" src="mascot.mp4" autoplay muted loop playsinline></video><h1 id="title">排假系統</h1></div><a href="admin.html" class="gear" title="排班設定">⚙️</a></header>
<div class="msw"><button id="pm">‹</button><b id="mlab"></b><button id="nm">›</button></div>
<div id="view"></div>
<div class="bar" id="bar"><button id="go" disabled>確定送出</button></div>
<div id="namespop-bg"></div>
<div id="namespop"><h3 id="namespop-title"></h3><div id="namespop-list"></div><button class="close" id="namespop-close">關閉</button></div>
<script>
var STAFF=['榮德','耀南','淑玲','泰霖','蓬逸','建發','敏誠','瑜芳','宜萱','俊霖'];
var EXEMPT=['榮德','俊霖'];
var WEEKLY=2;
var OPENFROM='',OPENTO='';
function weekKey(ds){var p=ds.split('-');var dt=new Date(Date.UTC(+p[0],+p[1]-1,+p[2]));dt.setUTCDate(dt.getUTCDate()-((dt.getUTCDay()+6)%7));return dt.toISOString().slice(0,10);}
function exemptNote(){return '';}
function weekCount(ds){var w=weekKey(ds),c=0;mine.forEach(function(x){if(weekKey(x)===w)c++;});return c;}
function dayName(a){return a.map(function(ds){return parseInt(ds.slice(8),10)+'號';}).join('、');}
var WD=['日','一','二','三','四','五','六'];
function nextMonth(){var d=new Date();d.setMonth(d.getMonth()+1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
var month=nextMonth(), me=null, mine=new Set(), serverMine=new Set(), stats={days:{},caps:{},maxLeave:4}, done=false, poll=null;

function ml(){var p=month.split('-');return p[0]+'年'+parseInt(p[1],10)+'月';}
function shiftMonth(k){var p=month.split('-'),y=+p[0],m=+p[1]+k;if(m<1){m=12;y--;}if(m>12){m=1;y++;}month=y+'-'+String(m).padStart(2,'0');me=null;mine=new Set();serverMine=new Set();done=false;render();}
document.getElementById('pm').onclick=function(){shiftMonth(-1);};
document.getElementById('nm').onclick=function(){shiftMonth(1);};

async function api(p,opt){var r=await fetch(p,opt);if(!r.ok){var e=new Error('net');e.status=r.status;try{e.body=await r.json();}catch(_){e.body=null;}throw e;}return r.json();}
function savedPin(n){return sessionStorage.getItem('shift_pin_'+n)||'';}
async function fetchStats(){try{stats=await api('/api/stats?month='+month);if(me&&!done)renderCal();}catch(e){}}
async function fetchMine(){try{var r=await api('/api/mine?name='+encodeURIComponent(me)+'&month='+month+'&pin='+encodeURIComponent(savedPin(me)));serverMine=new Set(r.leave||[]);mine=new Set(serverMine);}catch(e){serverMine=new Set();mine=new Set();}}

function others(ds){var c=(stats.days[ds]&&stats.days[ds].count)||0;if(serverMine.has(ds)&&EXEMPT.indexOf(me)<0)c--;return c;}
function capOf(ds){var n=stats.caps&&stats.caps[ds];return (n>=1)?n:stats.maxLeave;} // 單日自訂上限優先
function isFull(ds){if(EXEMPT.indexOf(me)>=0)return false;return others(ds)>=capOf(ds)&&!mine.has(ds);}

function render(){
  document.getElementById('title').textContent=ml()+' 排假系統';
  document.getElementById('mlab').textContent=ml();
  var v=document.getElementById('view'),bar=document.getElementById('bar');
  if(!me){renderNames(v);bar.innerHTML='<button id="go" disabled>請先選名字</button>';stopPoll();return;}
  if(done){renderDone(v);bar.innerHTML='<button id="go2" class="ghost" style="width:100%;padding:14px;border-radius:12px;background:#fff;color:#06C755;border:1.5px solid #06C755;font-size:17px;font-weight:700;cursor:pointer">修改我的休假</button>';document.getElementById('go2').onclick=function(){done=false;render();};stopPoll();return;}
  renderCal(v);
  function fmtD(ds){return parseInt(ds.slice(5,7),10)+'/'+parseInt(ds.slice(8),10);}
  var on=OPENFROM&&OPENTO?('，'+fmtD(OPENFROM)+'–'+fmtD(OPENTO)+' 開放選擇'):OPENFROM?('，'+fmtD(OPENFROM)+' 起開放選擇'):OPENTO?('，開放至 '+fmtD(OPENTO)):'';
  bar.innerHTML='<button id="go">確定送出（已選 '+mine.size+' 天）</button><div class="hint" style="text-align:center">每日上限 '+stats.maxLeave+' 人（部分日期較少），每週每人上限 '+WEEKLY+' 天'+on+'</div>';
  document.getElementById('go').onclick=submit;
  startPoll();
}
function renderNames(v){
  var h='<section><h2>請選擇姓名</h2><div class="names">';
  STAFF.forEach(function(n){h+='<button data-n="'+n+'">'+n+'</button>';});
  h+='</div></section>';
  h+='<section><div class="hint">選擇姓名 → 點選日期 → 確定送出。<br>首次使用請設定 4 位數密碼。<br>每日上限 '+stats.maxLeave+' 人（部分日期較少），每週每人上限 '+WEEKLY+' 天。</div></section>';
  v.innerHTML=h;
  v.querySelectorAll('.names button').forEach(function(b){b.onclick=function(){pickName(b.getAttribute('data-n'));};});
}

// 4 位數密碼驗證
async function pickName(n){
  me=n;done=false;
  var hasPin=false;
  try{var st=await api('/api/pin?name='+encodeURIComponent(n));hasPin=!!(st&&st.hasPin);}catch(e){renderPin(n,false,'連線失敗，請檢查網路後重試');return;}
  var sp=savedPin(n);
  if(hasPin&&sp){
    try{var v=await api('/api/pin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,pin:sp})});}
    catch(e){v=null;}
    if(v&&v.ok){await fetchMine();render();fetchStats();return;}
    sessionStorage.removeItem('shift_pin_'+n);
  }
  renderPin(n,hasPin);
}
function renderPin(n,hasPin,msg){
  var v=document.getElementById('view');
  var h='<section><h2>'+n+'，你好</h2>';
  if(hasPin){
    h+='<div class="hint">請輸入 4 位數密碼。</div><label class="pinlabel">4 位數密碼</label>';
  }else{
    h+='<div class="hint">請設定 4 位數密碼。</div><label class="pinlabel">設定 4 位數密碼</label>';
  }
  h+='<input type="password" class="pin" id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="••••"/>';
  h+='<div class="err" id="msg">'+(msg||'')+'</div>';
  h+='<button class="bigbtn" id="pinok">'+(hasPin?'確認':'設定並繼續')+'</button>';
  h+='<button class="ghostbtn" id="pinback">← 換名字</button></section>';
  v.innerHTML=h;
  document.getElementById('pinback').onclick=function(){me=null;render();};
  var go=async function(){
    var p=document.getElementById('pin').value.trim();
    var m=document.getElementById('msg');
    if(!/^\d{4}$/.test(p)){m.textContent='請輸入 4 位數字';return;}
    m.textContent='';
    var btn=document.getElementById('pinok');btn.disabled=true;btn.textContent='確認中…';
    try{
      var r=await api('/api/pin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(hasPin?{name:n,pin:p}:{name:n,newPin:p})});
      if(r&&r.ok){sessionStorage.setItem('shift_pin_'+n,p);await fetchMine();render();fetchStats();return;}
      m.textContent='失敗，請重試';
    }catch(e){
      var code=e&&e.body&&e.body.error;
      m.textContent=code==='locked'?'嘗試太多次，請 10 分鐘後再試':(e&&e.status===403?'密碼錯誤，請重試':'連線失敗，請檢查網路後重試');
    }
    btn.disabled=false;btn.textContent=hasPin?'確認':'設定並繼續';
  };
  document.getElementById('pinok').onclick=go;
  document.getElementById('pin').onkeydown=function(e){if(e.key==='Enter')go();};
  setTimeout(function(){var i=document.getElementById('pin');if(i)i.focus();},100);
}
function showNames(ds){
  var s=(stats.days[ds]&&stats.days[ds].names)||[];
  document.getElementById('namespop-title').textContent=parseInt(ds.slice(8),10)+' 號休假（'+s.length+'/'+capOf(ds)+' 人）：';
  document.getElementById('namespop-list').innerHTML=s.map(function(n){return '<span class="tag">'+n+'</span>';}).join('')||'（無資料）';
  document.getElementById('namespop-bg').style.display='block';
  document.getElementById('namespop').style.display='block';
}
function hideNames(){
  document.getElementById('namespop-bg').style.display='none';
  document.getElementById('namespop').style.display='none';
}
function renderCal(){
  var v=document.getElementById('view');
  var p=month.split('-'),y=+p[0],m=+p[1];
  var first=new Date(y,m-1,1).getDay(),dim=new Date(y,m,0).getDate();
  var h='<section><h2 style="display:flex;justify-content:space-between;align-items:center"><span>'+me+'，點日期選休假'+(EXEMPT.indexOf(me)>=0?'':'（再點一次取消）')+'</span><button id="switchuser" style="border:1.5px solid #ddd;background:#fff;border-radius:20px;padding:6px 14px;font-size:13px;color:#666;cursor:pointer;white-space:nowrap">換人</button></h2><div class="cal">';
  WD.forEach(function(w,i){h+='<div class="dow'+(i===0?' sun':'')+(i===6?' sat':'')+'">'+w+'</div>';});
  for(var i=0;i<first;i++)h+='<div class="day blank"></div>';
  function closed(ds){return (OPENFROM&&ds<OPENFROM)||(OPENTO&&ds>OPENTO);}
  function cell(ds,d){
    var pp=ds.split('-'),w=new Date(+pp[0],+pp[1]-1,+pp[2]).getDay(),wc=w===0?' sun':(w===6?' we':'');
    var c=(stats.days[ds]&&stats.days[ds].count)||0,cap=capOf(ds);
    if(mine.has(ds))return '<div class="day me" data-ds="'+ds+'"><span class="n">'+d+'</span><span class="c">我的休假</span></div>';
    if(closed(ds))return '<div class="day closed'+wc+'" data-ds="'+ds+'"><span class="n">'+d+'</span><span class="c">'+((OPENFROM&&ds<OPENFROM)?'已排完':'未開放')+'</span></div>';
    if(isFull(ds))return '<div class="day full'+wc+'" data-ds="'+ds+'"><span class="n">'+d+'</span><span class="c">已滿'+cap+'人</span></div>';
    return '<div class="day'+wc+'" data-ds="'+ds+'"><span class="n">'+d+'</span><span class="c">'+c+'/'+cap+'</span></div>';
  }
  for(var d=1;d<=dim;d++)h+=cell(month+'-'+String(d).padStart(2,'0'),d);
  if(OPENTO){
    var lastDs=month+'-'+String(dim).padStart(2,'0');
    if(OPENTO>lastDs){
      h+='<div style="grid-column:1/-1;color:#999;font-size:13px;margin-top:6px">'+parseInt(OPENTO.slice(5,7),10)+' 月</div>';
      var dt=new Date(y,m-1,dim+1),n=0;
      while(n<31){
        var tds=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
        if(tds>OPENTO)break;
        h+=cell(tds,dt.getDate());
        dt.setDate(dt.getDate()+1);n++;
      }
    }
  }
  h+='</div><div class="hint">綠色為你的休假；「已滿」點一下可查看名單；半透明日期無法選擇。</div><div class="err" id="err"></div></section>';
  v.innerHTML=h;
  var su=document.getElementById('switchuser');if(su)su.onclick=function(){me=null;done=false;render();};
  v.querySelectorAll('.day[data-ds]').forEach(function(el){
    el.onclick=function(){
      var ds=el.getAttribute('data-ds');
      if(el.classList.contains('closed'))return;
      if(el.classList.contains('full')){showNames(ds);return;}
      if(mine.has(ds)){mine.delete(ds);}
      else{
        if(weekCount(ds)>=WEEKLY){
          var e=document.getElementById('err');
          if(e)e.textContent='本週已達 '+WEEKLY+' 天上限，請改選其他週';
          return;
        }
        mine.add(ds);
      }
      renderCal();
      var go=document.getElementById('go');if(go)go.textContent='確定送出（已選 '+mine.size+' 天）';
    };
  });
}
function renderDone(v){
  var arr=[...mine].sort();
  var h='<section><div class="ok"><div class="big">✓</div><p><b>'+me+'</b>，你選了 <b>'+arr.length+'</b> 天休假：</p><div>';
  arr.forEach(function(ds){h+='<span class="tag">'+parseInt(ds.slice(8),10)+'號</span>';});
  h+='</div><div class="hint">如需修改請按「修改我的休假」。</div></div></section>';
  v.innerHTML=h;
}
async function submit(){
  var go=document.getElementById('go');go.disabled=true;go.textContent='送出中…';
  try{
    var r=await api('/api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:me,month:month,leave:[...mine],pin:savedPin(me)})});
    var msg='';
    if(r.rejected&&r.rejected.length){
      r.rejected.forEach(function(ds){mine.delete(ds);});
      msg+='以下日期已被選滿，請改選其他日期：'+dayName(r.rejected)+'。';
    }
    if(r.rejectedWeekly&&r.rejectedWeekly.length){
      r.rejectedWeekly.forEach(function(ds){mine.delete(ds);});
      msg+='以下日期超過每週 '+(r.weeklyCap||WEEKLY)+' 天上限：'+dayName(r.rejectedWeekly)+'。';
    }
    if(r.rejectedClosed&&r.rejectedClosed.length){
      r.rejectedClosed.forEach(function(ds){mine.delete(ds);});
      msg+='以下日期不開放選擇：'+dayName(r.rejectedClosed)+'。';
    }
    if(msg){
      renderCal();
      document.getElementById('err').textContent=msg;
      var go2=document.getElementById('go');if(go2){go2.disabled=false;go2.textContent='確定送出（已選 '+mine.size+' 天）';go2.onclick=submit;}
      await fetchStats();await fetchMine();return;
    }
    serverMine=new Set([...mine]);done=true;render();fetchStats();
  }catch(e){
    if(e&&e.status===403){
      var code=e.body&&e.body.error;
      if(code==='locked'){alert('嘗試太多次，請 10 分鐘後再試');go.disabled=false;go.textContent='確定送出（已選 '+mine.size+' 天）';return;}
      sessionStorage.removeItem('shift_pin_'+me);
      if(code==='pin_required'){renderPin(me,false,'請先設定 4 位數密碼');return;}
      renderPin(me,true,'密碼不正確或已失效，請重新輸入');return;
    }
    go.disabled=false;go.textContent='確定送出（已選 '+mine.size+' 天）';alert('送出失敗，請檢查網路後再試');
  }
}
function startPoll(){stopPoll();poll=setInterval(fetchStats,5000);}
function stopPoll(){if(poll){clearInterval(poll);poll=null;}}
async function boot(){
  document.getElementById('namespop-close').onclick=hideNames;
  document.getElementById('namespop-bg').onclick=hideNames;
  try{
    var c=await api('/api/config');
    if(c.staff&&c.staff.length)STAFF=c.staff;
    if(c.exempt)EXEMPT=c.exempt;
    if(c.weeklyCap)WEEKLY=c.weeklyCap;
    if(c.openFrom!==undefined)OPENFROM=c.openFrom||'';
    if(c.openTo!==undefined)OPENTO=c.openTo||'';
  }catch(e){}
  render();fetchStats();
}
boot();
</script>
</body>
</html>
