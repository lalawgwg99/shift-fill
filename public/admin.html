<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>排班設定</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:#f4f5f7;color:#222;padding-bottom:60px}
header{background:#06C755;color:#fff;padding:14px 16px;position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:18px}
header a{color:#fff;font-size:14px;text-decoration:none}
section{background:#fff;margin:10px 12px;border-radius:12px;padding:14px}
h2{font-size:15px;margin-bottom:10px}
label{display:block;font-size:14px;font-weight:700;margin:14px 0 6px}
label small{font-weight:400;color:#888}
input[type=number],input[type=password],input[type=date],textarea{width:100%;border:1.5px solid #ddd;border-radius:10px;padding:12px;font-size:16px;font-family:inherit}
textarea{min-height:150px;line-height:1.8;resize:vertical}
.num{max-width:140px}
.exlist{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.exlist label{margin:0;font-weight:400;font-size:14px;border:1.5px solid #ddd;border-radius:20px;padding:8px 14px;cursor:pointer;display:flex;align-items:center;gap:6px}
.exlist label.on{background:#e8f9ee;border-color:#06C755;color:#0a7d2c;font-weight:700}
.exlist input{accent-color:#06C755;width:16px;height:16px}
.bigbtn{width:100%;padding:14px;border:none;border-radius:12px;background:#06C755;color:#fff;font-size:17px;font-weight:700;cursor:pointer;margin-top:16px}
.bigbtn:disabled{background:#ccc}
.ghostbtn{width:100%;padding:12px;border-radius:12px;background:#fff;color:#666;border:1.5px solid #ddd;font-size:15px;cursor:pointer;margin-top:10px}
.hint{font-size:12px;color:#888;margin-top:8px;line-height:1.7}
.err{color:#e5484d;font-size:14px;margin-top:10px;font-weight:700}
.okmsg{color:#0a7d2c;font-size:14px;margin-top:10px;font-weight:700}
.center{text-align:center;padding:40px 16px;color:#888}
.ccal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.cdow{font-size:12px;color:#888;text-align:center;padding:4px 0}
.cday{border:1.5px solid #e3e3e3;border-radius:8px;background:#fff;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
.cday .n{font-size:15px;font-weight:700}
.cday .cc{font-size:11px;color:#888}
.cday.custom{background:#fff7e6;border-color:#e6a23c}
.cday.custom .cc{color:#b26a00;font-weight:700}
.cday.blank{background:transparent;border:none;cursor:default}
</style>
</head>
<body>
<header><h1>排班設定</h1><a href="index.html">← 回填寫頁</a></header>
<div id="view"><div class="center">讀取中…</div></div>
<script>
var TKEY='shift_admin_token';
var token=sessionStorage.getItem(TKEY)||'';
var cfg=null;

function dDiff(a,b){
  var da=new Date(+a.slice(0,4),+a.slice(5,7)-1,+a.slice(8,10));
  var db=new Date(+b.slice(0,4),+b.slice(5,7)-1,+b.slice(8,10));
  return Math.round((db-da)/86400000);
}
function lastDayOf(m){return new Date(+m.slice(0,4),+m.slice(5,7),0).getDate();}
function maxGapDays(leaves,start,end){
  var ds=leaves.filter(function(d){return d>=start&&d<=end;}).sort();
  if(!ds.length)return dDiff(start,end);
  var g=dDiff(start,ds[0]);
  for(var i=0;i<ds.length-1;i++)g=Math.max(g,dDiff(ds[i],ds[i+1])-1);
  g=Math.max(g,dDiff(ds[ds.length-1],end));
  return g;
}
async function api(p,opt){
  var r=await fetch(p,opt);
  var j=null;try{j=await r.json();}catch(e){}
  return {status:r.status,body:j};
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

async function boot(){
  var r=await api('/api/config');
  if(r.status!==200||!r.body){document.getElementById('view').innerHTML='<div class="center">讀取設定失敗，請檢查網路後重新整理</div>';return;}
  cfg=r.body;
  render();
}

function render(){
  var v=document.getElementById('view');
  if(!cfg.hasAdminToken){renderSetup(v);return;}
  if(!token){renderLock(v);return;}
  renderForm(v);
}

function renderSetup(v){
  v.innerHTML='<section><h2>初次設定</h2>'
    +'<div class="hint">請設定管理密碼（至少 4 碼）。</div>'
    +'<label>管理密碼</label><input type="password" id="pw1" inputmode="numeric" placeholder="至少 4 碼"/>'
    +'<label>再輸入一次</label><input type="password" id="pw2" inputmode="numeric" placeholder="確認密碼"/>'
    +'<div class="err" id="msg"></div>'
    +'<button class="bigbtn" id="ok">設定密碼並繼續</button></section>';
  document.getElementById('ok').onclick=async function(){
    var a=document.getElementById('pw1').value,b=document.getElementById('pw2').value;
    var m=document.getElementById('msg');
    if(a.length<4){m.textContent='密碼至少 4 碼';return;}
    if(a!==b){m.textContent='兩次輸入不一致';return;}
    m.textContent='';
    var r=await api('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({newToken:a})});
    if(r.status===200&&r.body&&r.body.ok){
      token=a;sessionStorage.setItem(TKEY,token);cfg=r.body;render();
    }else{m.textContent='設定失敗，請再試一次';}
  };
}

function renderLock(v,err){
  v.innerHTML='<section><h2>管理員登入</h2>'
    +'<div class="hint">請輸入管理密碼。</div>'
    +'<label>管理密碼</label><input type="password" id="pw" inputmode="numeric" placeholder="管理密碼"/>'
    +'<div class="err" id="msg">'+(err||'')+'</div>'
    +'<button class="bigbtn" id="ok">登入</button></section>';
  var go=async function(){
    var pw=document.getElementById('pw').value;
    if(!pw)return;
    var r=await api('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:pw})});
    if(r.status===200&&r.body){
      token=pw;sessionStorage.setItem(TKEY,token);cfg=r.body;render();
    }else{
      renderLock(document.getElementById('view'),'密碼錯誤，請重試');
    }
  };
  document.getElementById('ok').onclick=go;
  document.getElementById('pw').onkeydown=function(e){if(e.key==='Enter')go();};
}

function renderForm(v){
  var staffTxt=cfg.staff.join('\n');
  var t=new Date();var curM=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0');
  var schedMonth=cfg.openFrom?cfg.openFrom.slice(0,7):curM;
  var h='<section><h2>休假一覽</h2>'
    +'<div style="display:flex;gap:8px;align-items:center">'
    +'<input type="month" id="v_month" style="max-width:170px" value="'+schedMonth+'"/>'
    +'<button class="ghostbtn" id="v_reload" style="width:auto;margin-top:0;padding:10px 18px">重新整理</button>'
    +'<button class="ghostbtn" id="v_xlsx" style="width:auto;margin-top:0;padding:10px 18px">匯出 Excel</button>'
    +'</div>'
    +'<div class="hint">「最長未休」超過 7 天會以紅色標示。</div>'
    +'<div id="sched" style="margin-top:6px"><div class="hint">讀取中…</div></div>'
    +'</section>'
    +'<section><h2>單日人數上限</h2>'
    +'<div class="hint">某些日子想限制更少人休假（例如只准 2～3 人）時，點該日期切換：預設 → 3 → 2 → 1 → 預設。橘色為自訂日期，點一下立即生效。</div>'
    +'<div style="margin-top:8px"><input type="month" id="c_month" style="max-width:170px" value="'+schedMonth+'"/></div>'
    +'<div id="capcal"><div class="hint">讀取中…</div></div>'
    +'<div class="err" id="capmsg"></div>'
    +'</section>'
    +'<section><h2>休假規則</h2>'
    +'<label>每日休假人數上限</label>'
    +'<input type="number" class="num" id="f_cap" min="1" max="20" value="'+cfg.maxLeave+'"/>'
    +'<label>每週每人休假天數上限</label>'
    +'<input type="number" class="num" id="f_weekly" min="1" max="7" value="'+cfg.weeklyCap+'"/>'
    +'<label>開放起始日 <small>（留空表示不限制）</small></label>'
    +'<input type="date" id="f_openfrom" style="max-width:190px" value="'+(cfg.openFrom||'')+'"/>'
    +'<label>開放結束日 <small>（留空表示不限制）</small></label>'
    +'<input type="date" id="f_opento" style="max-width:190px" value="'+(cfg.openTo||'')+'"/>'
    +'</section>'
    +'<section><h2>人員</h2>'
    +'<label>員工名單 <small>（一人一行）</small></label>'
    +'<textarea id="f_staff">'+esc(staffTxt)+'</textarea>'
    +'<label>不佔名額人員</label>'
    +'<div class="exlist" id="exlist"></div>'
    +'<label>重設個人密碼 <small>（重設後需重新設定）</small></label>'
    +'<div id="pinlist"><div class="hint">讀取中…</div></div>'
    +'</section>'
    +'<section><h2>管理密碼</h2>'
    +'<label>新密碼 <small>（留空表示不更換）</small></label>'
    +'<input type="password" id="f_newpw" inputmode="numeric" placeholder="新密碼（至少 4 碼）"/>'
    +'<div class="err" id="msg"></div><div class="okmsg" id="okmsg"></div>'
    +'<button class="bigbtn" id="save">儲存設定</button>'
    +'<button class="ghostbtn" id="logout">登出</button>'
    +'</section>'
    +'<section><h2 style="color:#c0392b">危險區</h2>'
    +'<label>清空排假月份</label>'
    +'<input type="month" id="f_clearmonth" style="max-width:170px" value="'+schedMonth+'"/>'
    +'<div class="hint">僅刪除該月排假資料（保留個人密碼），無法復原。</div>'
    +'<button class="ghostbtn" id="clear" style="color:#c0392b;border-color:#c0392b">清空該月排假</button>'
    +'</section>';
  v.innerHTML=h;
  var loadSched=async function(){
    var box=document.getElementById('sched');if(!box)return;
    var m=document.getElementById('v_month').value;
    if(!/^\d{4}-\d{2}$/.test(m)){box.innerHTML='<div class="hint">月份格式錯誤</div>';return;}
    box.innerHTML='<div class="hint">讀取中…</div>';
    try{
      var r=await api('/api/export?month='+m);
      if(r.status!==200||!r.body){box.innerHTML='<div class="hint">讀取失敗</div>';return;}
      var subs=r.body.submissions||[];
      var capsR=await api('/api/caps?month='+m);
      var caps=(capsR.body&&capsR.body.caps)||{};
      var capFor=function(d){return (caps[d]>=1)?caps[d]:cfg.maxLeave;};
      var byDay={};
      subs.forEach(function(s){(s.leave||[]).forEach(function(d){(byDay[d]=byDay[d]||[]).push(s.name);});});
      var days=Object.keys(byDay).sort();
      var h='';
      if(!days.length){h='<div class="hint">這個月還沒有人送出</div>';}
      else{
        days.forEach(function(d){
          var names=byDay[d].slice().sort();
          var cnt=names.filter(function(n){return cfg.exempt.indexOf(n)<0;}).length;
          var cap=capFor(d);
          var full=cnt>=cap;
          var wd='日一二三四五六'[new Date(+d.slice(0,4),+d.slice(5,7)-1,+d.slice(8,10)).getDay()];
          h+='<div style="display:flex;gap:8px;align-items:baseline;padding:8px 2px;border-bottom:1px solid #f0f0f0;font-size:14px">'
            +'<span style="white-space:nowrap;font-weight:700;min-width:88px">'+parseInt(d.slice(5,7),10)+'/'+parseInt(d.slice(8,10),10)+'（'+wd+'）</span>'
            +'<span style="white-space:nowrap;font-weight:700;color:'+(full?'#c0392b':'#0a7d2c')+'">'+cnt+'/'+cap+(full?' 滿':'')+'</span>'
            +'<span style="color:#333">'+names.join('、')+'</span></div>';
        });
      }
      var per={};
      subs.forEach(function(s){per[s.name]=(s.leave||[]).slice().sort();});
      var pn=Object.keys(per).sort();
      var mFirst=m+'-01',mLast=m+'-'+String(lastDayOf(m)).padStart(2,'0');
      var pStart=mFirst,pEnd=mLast;
      if(cfg.openFrom&&cfg.openFrom>mFirst&&cfg.openFrom<=mLast)pStart=cfg.openFrom;
      if(cfg.openTo&&cfg.openTo>=mFirst)pEnd=cfg.openTo;
      if(pEnd<pStart){pStart=mFirst;pEnd=mLast;}
      if(pn.length){
        h+='<div class="hint" style="margin:12px 0 4px">每人小計</div>';
        pn.forEach(function(n){
          var ds=per[n].map(function(d){return parseInt(d.slice(5,7),10)+'/'+parseInt(d.slice(8,10),10);});
          var gap=maxGapDays(per[n],pStart,pEnd);
          var warn=gap>7;
          h+='<div style="font-size:13px;color:#555;padding:5px 2px;border-bottom:1px solid #f5f5f5">'+n+'：'
            +(ds.length?ds.join('、')+'（共'+ds.length+'天）':'未排')
            +'｜最長 <span style="font-weight:700;color:'+(warn?'#c0392b':'#0a7d2c')+'">'+gap+' 天未休</span>'
            +(warn?' ⚠️':'')+'</div>';
        });
      }
      box.innerHTML=h;
    }catch(e){box.innerHTML='<div class="hint">讀取失敗，請檢查網路</div>';}
  };
  document.getElementById('v_reload').onclick=loadSched;
  loadSched();
  var dayCaps={};
  var renderCapCal=async function(){
    var box=document.getElementById('capcal');if(!box)return;
    var m=document.getElementById('c_month').value;
    if(!/^\d{4}-\d{2}$/.test(m)){box.innerHTML='<div class="hint">月份格式錯誤</div>';return;}
    box.innerHTML='<div class="hint">讀取中…</div>';
    try{
      var r=await api('/api/caps?month='+m);
      dayCaps=(r.body&&r.body.caps)||{};
    }catch(e){dayCaps={};}
    var p=m.split('-'),y=+p[0],mo=+p[1];
    var first=new Date(y,mo-1,1).getDay(),dim=new Date(y,mo,0).getDate();
    var h='<div class="ccal">';
    ['日','一','二','三','四','五','六'].forEach(function(w){h+='<div class="cdow">'+w+'</div>';});
    for(var i=0;i<first;i++)h+='<div class="cday blank"></div>';
    for(var d=1;d<=dim;d++){
      var ds=m+'-'+String(d).padStart(2,'0');
      var cv=dayCaps[ds],custom=cv>=1;
      h+='<div class="cday'+(custom?' custom':'')+'" data-ds="'+ds+'"><span class="n">'+d+'</span><span class="cc">'+(custom?cv+' 人':'預設'+cfg.maxLeave)+'</span></div>';
    }
    h+='</div>';
    box.innerHTML=h;
    box.querySelectorAll('.cday[data-ds]').forEach(function(el){
      el.onclick=async function(){
        var ds=el.getAttribute('data-ds');
        var cur=dayCaps[ds]>=1?dayCaps[ds]:null;
        var nxt=cur===null?3:(cur===3?2:(cur===2?1:null));
        var msg=document.getElementById('capmsg');msg.textContent='';
        var payload={};payload[ds]=nxt;
        var r2=await api('/api/caps',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token,caps:payload})});
        if(r2.status===403){
          token='';sessionStorage.removeItem(TKEY);
          renderLock(document.getElementById('view'),'密碼錯誤或已失效，請重新登入');
          return;
        }
        if(r2.status!==200||!r2.body||!r2.body.ok){msg.textContent='儲存失敗，請重試';return;}
        if(nxt===null)delete dayCaps[ds];else dayCaps[ds]=nxt;
        renderCapCal();
      };
    });
  };
  document.getElementById('c_month').onchange=renderCapCal;
  renderCapCal();
  document.getElementById('v_xlsx').onclick=async function(){
    var m=document.getElementById('v_month').value;
    if(!/^\d{4}-\d{2}$/.test(m)){alert('月份格式錯誤');return;}
    var btn=this;btn.disabled=true;btn.textContent='匯出中…';
    try{
      var r=await fetch('/api/export-xlsx',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token,month:m})});
      if(r.status!==200){var j=null;try{j=await r.json();}catch(e){}alert('匯出失敗：'+((j&&j.error)||r.status));return;}
      var blob=await r.blob();
      var a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download='排假-'+m+'.xlsx';
      document.body.appendChild(a);a.click();
      setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);
    }catch(e){alert('匯出失敗，請檢查網路');}
    btn.disabled=false;btn.textContent='匯出 Excel';
  };
  document.getElementById('clear').onclick=async function(){
    var m=document.getElementById('f_clearmonth').value;
    if(!/^\d{4}-\d{2}$/.test(m)){alert('月份格式錯誤');return;}
    if(!confirm('確定清空 '+m+' 的排假資料？此動作無法復原。'))return;
    if(!confirm('再次確認刪除？'))return;
    var r=await api('/api/clear',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token,month:m})});
    if(r.status===200&&r.body&&r.body.ok){alert('已清空 '+m+'，共刪除 '+r.body.deleted+' 筆排假');loadSched();}
    else if(r.status===403){alert('管理密碼錯誤或已失效，請重新登入');}
    else{alert('清空失敗，請檢查網路後再試');}
  };
  var buildEx=function(){
    var names=document.getElementById('f_staff').value.split('\n').map(function(s){return s.trim();}).filter(Boolean);
    var checked={};
    var hadInputs=document.querySelectorAll('#exlist input').length>0;
    document.querySelectorAll('#exlist input:checked').forEach(function(c){checked[c.value]=1;});
    var box=document.getElementById('exlist');
    box.innerHTML='';
    names.forEach(function(n){
      var lab=document.createElement('label');
      var cb=document.createElement('input');
      cb.type='checkbox';cb.value=n;
      if(checked[n]||(!hadInputs&&cfg.exempt.indexOf(n)>=0))cb.checked=true;
      cb.onchange=function(){lab.classList.toggle('on',cb.checked);};
      lab.appendChild(cb);lab.appendChild(document.createTextNode(n));
      if(cb.checked)lab.classList.add('on');
      box.appendChild(lab);
    });
  };
  var buildPinList=function(){
    var box=document.getElementById('pinlist');if(!box)return;box.innerHTML='';
    var names=document.getElementById('f_staff').value.split('\n').map(function(s){return s.trim();}).filter(Boolean);
    var set={};(cfg.pinSet||[]).forEach(function(n){set[n]=1;});
    if(!names.length){box.innerHTML='<div class="hint">尚無員工名單</div>';return;}
    names.forEach(function(n){
      var row=document.createElement('div');
      row.style.cssText='display:flex;justify-content:space-between;align-items:center;padding:9px 2px;border-bottom:1px solid #f0f0f0;font-size:14px';
      var left=document.createElement('span');left.textContent=n;row.appendChild(left);
      var right=document.createElement('span');
      if(set[n]){
        right.innerHTML='<span style="color:#0a7d2c;font-size:13px;margin-right:8px">已設定</span>';
        var btn=document.createElement('button');btn.textContent='重設';
        btn.style.cssText='padding:6px 14px;border-radius:20px;background:#fff;color:#666;border:1.5px solid #ddd;font-size:13px;cursor:pointer';
        btn.onclick=function(){resetPin(n);};
        right.appendChild(btn);
      }else{right.innerHTML='<span style="color:#aaa;font-size:13px">未設定</span>';}
      row.appendChild(right);box.appendChild(row);
    });
  };
  var resetPin=async function(n){
    if(!confirm('確定要重設「'+n+'」的 4 位數密碼嗎？\n他下次進來要重新設定一組。'))return;
    var r=await api('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token,resetPin:n})});
    if(r.status===200&&r.body){cfg=r.body;buildPinList();}
    else{alert('重設失敗，請重試');}
  };
  document.getElementById('f_staff').oninput=function(){buildEx();buildPinList();};
  buildEx();buildPinList();
  document.getElementById('logout').onclick=function(){
    token='';sessionStorage.removeItem(TKEY);render();
  };
  document.getElementById('save').onclick=async function(){
    var m=document.getElementById('msg'),okm=document.getElementById('okmsg');
    m.textContent='';okm.textContent='';
    var cap=parseInt(document.getElementById('f_cap').value,10);
    var weekly=parseInt(document.getElementById('f_weekly').value,10);
    var staff=document.getElementById('f_staff').value.split('\n').map(function(s){return s.trim();}).filter(Boolean);
    var exChecked=[];document.querySelectorAll('#exlist input:checked').forEach(function(c){exChecked.push(c.value);});
    var newpw=document.getElementById('f_newpw').value;
    var openfrom=document.getElementById('f_openfrom').value;
    var opento=document.getElementById('f_opento').value;
    if(!(cap>=1&&cap<=20)){m.textContent='每天人數請填 1～20';return;}
    if(!(weekly>=1&&weekly<=7)){m.textContent='每週天數請填 1～7';return;}
    if(openfrom&&!/^\d{4}-\d{2}-\d{2}$/.test(openfrom)){m.textContent='起始日格式錯誤';return;}
    if(opento&&!/^\d{4}-\d{2}-\d{2}$/.test(opento)){m.textContent='結束日格式錯誤';return;}
    if(openfrom&&opento&&opento<openfrom){m.textContent='結束日不能早於起始日';return;}
    if(!staff.length){m.textContent='員工名單不能空白';return;}
    if(newpw&&newpw.length<4){m.textContent='新密碼至少 4 碼';return;}
    var payload={token:token,maxLeave:cap,weeklyCap:weekly,openFrom:openfrom,openTo:opento,staff:staff,exempt:exChecked};
    if(newpw)payload.newToken=newpw;
    var btn=document.getElementById('save');btn.disabled=true;btn.textContent='儲存中…';
    var r=await api('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    btn.disabled=false;btn.textContent='儲存設定';
    if(r.status===403){
      token='';sessionStorage.removeItem(TKEY);
      renderLock(document.getElementById('view'),'密碼錯誤或已失效，請重新登入');
      return;
    }
    if(r.status!==200||!r.body||!r.body.ok){m.textContent='儲存失敗：'+((r.body&&r.body.error)||('HTTP '+r.status));return;}
    if(newpw){token=newpw;sessionStorage.setItem(TKEY,token);}
    cfg=r.body;okm.textContent='已儲存 ✓';document.getElementById('f_newpw').value='';buildPinList();
    window.scrollTo(0,document.body.scrollHeight);
  };
}

boot();
</script>
</body>
</html>
